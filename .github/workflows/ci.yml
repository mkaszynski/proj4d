name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Headless graphical smoke tests
        run: |
          ./build/proj4d --menu-smoke-test --smoke-output build/proj4d-menu.bmp
          ./build/proj4d --smoke-test --smoke-output build/proj4d-flat.bmp
          ./build/proj4d --low-smoke-test --smoke-output build/proj4d-low.bmp
          ./build/proj4d --normal-smoke-test --smoke-output build/proj4d-normal.bmp
      - name: Verify smoke images
        run: |
          test -s build/proj4d-menu.bmp
          test -s build/proj4d-flat.bmp
          test -s build/proj4d-low.bmp
          test -s build/proj4d-normal.bmp
